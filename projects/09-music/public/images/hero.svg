<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <rect width="800" height="400" fill="#f3f0ff"/>
  <!-- Vinyl record -->
  <circle cx="400" cy="200" r="160" fill="#1e1e2e"/>
  <circle cx="400" cy="200" r="120" fill="#2d2d3f"/>
  <circle cx="400" cy="200" r="80"  fill="#1e1e2e"/>
  <circle cx="400" cy="200" r="40"  fill="#3b3b55"/>
  <circle cx="400" cy="200" r="14"  fill="#7c3aed"/>
  <circle cx="400" cy="200" r="5"   fill="white"/>
  <!-- Grooves -->
  <circle cx="400" cy="200" r="100" stroke="#2a2a40" stroke-width="1" fill="none"/>
  <circle cx="400" cy="200" r="90"  stroke="#2a2a40" stroke-width="1" fill="none"/>
  <circle cx="400" cy="200" r="110" stroke="#2a2a40" stroke-width="1" fill="none"/>
  <!-- Music notes -->
  <text x="160" y="180" font-size="48" fill="#7c3aed" opacity="0.4">♪</text>
  <text x="600" y="150" font-size="36" fill="#7c3aed" opacity="0.3">♫</text>
  <text x="100" y="300" font-size="30" fill="#7c3aed" opacity="0.2">♩</text>
  <text x="650" y="320" font-size="40" fill="#7c3aed" opacity="0.25">♬</text>
</svg>
